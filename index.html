<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OpenD 看板" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>OpenD Mobile</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif; background:#0b1020; color:#fff; }
    body { min-height:100dvh; }
    .app { min-height:100dvh; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; background:#111827; border-bottom:1px solid rgba(255,255,255,.08); }
    .brand { font-weight:700; letter-spacing:.2px; }
    .version { margin-left:auto; font-size:12px; color:#94a3b8; }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:28px 18px calc(28px + env(safe-area-inset-bottom)); }
    .card { width:min(100%,460px); background:#111827; border:1px solid #263247; border-radius:22px; padding:24px; box-shadow:0 22px 60px rgba(0,0,0,.28); }
    h1 { margin:0 0 10px; font-size:26px; line-height:1.2; }
    p { margin:0; color:#aeb8c8; line-height:1.65; }
    .source { margin:18px 0; padding:13px 14px; border-radius:13px; background:#0b1220; border:1px solid #263247; }
    .source-label { display:block; font-size:12px; color:#7f8da3; margin-bottom:6px; }
    .source-value { display:block; font-size:13px; color:#dbeafe; word-break:break-all; }
    button { border:0; border-radius:13px; font-size:16px; font-weight:600; cursor:pointer; }
    .primary { width:100%; padding:15px 16px; background:#2563eb; color:#fff; }
    .secondary { width:100%; margin-top:10px; padding:13px 16px; background:#1f2937; color:#fff; border:1px solid #334155; }
    .note { margin-top:16px; font-size:12px; color:#7f8da3; text-align:center; }
    dialog { width:min(92vw,460px); border:0; border-radius:18px; padding:0; box-shadow:0 24px 80px rgba(0,0,0,.35); }
    dialog::backdrop { background:rgba(0,0,0,.55); }
    .dialog-body { padding:20px; background:#fff; color:#111827; }
    .dialog-body h2 { margin:0 0 10px; font-size:20px; }
    .hint { font-size:12px; color:#6b7280; line-height:1.55; margin-bottom:10px; }
    input { width:100%; padding:12px; border:1px solid #d1d5db; border-radius:10px; font-size:16px; margin:8px 0 12px; background:#fff; color:#111827; }
    .row { display:flex; gap:8px; }
    .row button { flex:1; padding:11px 12px; font-size:14px; }
    .save { background:#111827; color:#fff; }
    .cancel { background:#e5e7eb; color:#111827; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">OpenD Mobile</div>
    <div class="version">V1.1</div>
  </header>

  <main>
    <section class="card">
      <h1>5分钟看板</h1>
      <p>直接打开当前 Cloudflare 看板，不再使用 iframe。这样不同 iPhone 的 Safari 隐私限制不会影响看板加载。</p>

      <div class="source">
        <span class="source-label">当前看板地址</span>
        <span id="currentUrl" class="source-value">读取中…</span>
      </div>

      <button id="openBtn" class="primary" type="button">进入5分钟看板</button>
      <button id="settingsBtn" class="secondary" type="button">设置 Tunnel 地址</button>
      <div class="note">这里只保存访问地址；不会修改 OpenD、冻结扫描器、Drive 或交易程序。</div>
    </section>
  </main>
</div>

<dialog id="settingsDialog">
  <form method="dialog" class="dialog-body" id="settingsForm">
    <h2>设置 Tunnel 地址</h2>
    <div class="hint">Cloudflare Quick Tunnel 地址变化时，把新的 https://xxxx.trycloudflare.com 粘贴到这里即可。PWA 固定地址和桌面图标不用重装。</div>
    <input id="urlInput" type="url" inputmode="url" autocomplete="off" placeholder="https://xxxx.trycloudflare.com" required />
    <div class="row">
      <button class="cancel" type="button" id="cancelBtn">取消</button>
      <button class="save" type="submit">保存</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const DEFAULT_URL = 'https://flexibility-frame-madonna-indexes.trycloudflare.com';
  const KEY = 'opend_mobile_dashboard_url_v1';
  const valueEl = document.getElementById('currentUrl');
  const dialog = document.getElementById('settingsDialog');
  const input = document.getElementById('urlInput');

  function normalize(raw) {
    const value = (raw || '').trim();
    if (!value) return '';
    try {
      const u = new URL(value);
      if (u.protocol !== 'https:') return '';
      return u.href.replace(/\/$/, '');
    } catch { return ''; }
  }

  function currentUrl() {
    return normalize(localStorage.getItem(KEY)) || DEFAULT_URL;
  }

  function refreshLabel() {
    valueEl.textContent = currentUrl();
  }

  function openSettings() {
    input.value = currentUrl();
    dialog.showModal();
    setTimeout(() => input.focus(), 60);
  }

  document.getElementById('openBtn').addEventListener('click', () => {
    window.location.assign(currentUrl());
  });

  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('cancelBtn').addEventListener('click', () => dialog.close());

  document.getElementById('settingsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const clean = normalize(input.value);
    if (!clean) {
      input.setCustomValidity('请输入有效的 https:// 地址');
      input.reportValidity();
      return;
    }
    input.setCustomValidity('');
    localStorage.setItem(KEY, clean);
    dialog.close();
    refreshLabel();
  });

  refreshLabel();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
