<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OpenD 看板" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>OpenD Mobile</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif; background:#0b1020; color:#fff; }
    body { min-height:100dvh; }
    .app { min-height:100dvh; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; background:#111827; border-bottom:1px solid rgba(255,255,255,.08); }
    .brand { font-weight:700; letter-spacing:.2px; }
    .version { margin-left:auto; font-size:12px; color:#94a3b8; }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:28px 18px calc(28px + env(safe-area-inset-bottom)); }
    .card { width:min(100%,460px); background:#111827; border:1px solid #263247; border-radius:22px; padding:24px; box-shadow:0 22px 60px rgba(0,0,0,.28); }
    h1 { margin:0 0 10px; font-size:26px; line-height:1.2; }
    p { margin:0; color:#aeb8c8; line-height:1.65; }
    .source { margin:18px 0; padding:13px 14px; border-radius:13px; background:#0b1220; border:1px solid #263247; }
    .source-label { display:block; font-size:12px; color:#7f8da3; margin-bottom:6px; }
    .source-value { display:block; font-size:13px; color:#dbeafe; word-break:break-all; }
    .status { margin-top:8px; font-size:12px; color:#94a3b8; }
    .status.ok { color:#86efac; }
    .status.bad { color:#fca5a5; }
    button { border:0; border-radius:13px; font-size:16px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .primary { width:100%; padding:15px 16px; background:#2563eb; color:#fff; }
    .secondary { width:100%; margin-top:10px; padding:13px 16px; background:#1f2937; color:#fff; border:1px solid #334155; }
    .note { margin-top:16px; font-size:12px; color:#7f8da3; text-align:center; line-height:1.55; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">OpenD Mobile</div>
    <div class="version">V1.2</div>
  </header>

  <main>
    <section class="card">
      <h1>5分钟看板</h1>
      <p>所有手机统一读取 GitHub 上的中央 Tunnel 地址。Cloudflare 地址以后变化时，只改一次中央配置即可。</p>

      <div class="source">
        <span class="source-label">中央看板地址</span>
        <span id="currentUrl" class="source-value">读取中…</span>
        <div id="status" class="status">正在读取中央配置…</div>
      </div>

      <button id="openBtn" class="primary" type="button" disabled>进入5分钟看板</button>
      <button id="refreshBtn" class="secondary" type="button">刷新中央地址</button>
      <div class="note">中央地址来自 config.json；本页不再使用每台手机各自保存的 Tunnel 地址。不会修改 OpenD、冻结扫描器、Drive 或交易程序。</div>
    </section>
  </main>
</div>

<script>
(() => {
  const valueEl = document.getElementById('currentUrl');
  const statusEl = document.getElementById('status');
  const openBtn = document.getElementById('openBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  let centralUrl = '';

  function normalize(raw) {
    const value = (raw || '').trim();
    if (!value) return '';
    try {
      const u = new URL(value);
      if (u.protocol !== 'https:') return '';
      if (u.origin === location.origin) return '';
      return u.href.replace(/\/$/, '');
    } catch {
      return '';
    }
  }

  function setStatus(text, state='') {
    statusEl.textContent = text;
    statusEl.className = 'status' + (state ? ' ' + state : '');
  }

  async function loadCentralConfig() {
    openBtn.disabled = true;
    refreshBtn.disabled = true;
    setStatus('正在读取中央配置…');
    try {
      const response = await fetch('./config.json?ts=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      const url = normalize(data.tunnel_url);
      if (!url) throw new Error('中央 Tunnel 地址无效');
      centralUrl = url;
      valueEl.textContent = centralUrl;
      setStatus('中央地址已同步', 'ok');
      openBtn.disabled = false;
      return centralUrl;
    } catch (error) {
      centralUrl = '';
      valueEl.textContent = '暂时无法读取';
      setStatus('中央配置读取失败，请稍后刷新', 'bad');
      throw error;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener('click', () => {
    loadCentralConfig().catch(() => {});
  });

  openBtn.addEventListener('click', async () => {
    try {
      const url = await loadCentralConfig();
      window.location.assign(url);
    } catch {
      alert('暂时无法读取中央看板地址，请稍后再试。');
    }
  });

  loadCentralConfig().catch(() => {});

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
